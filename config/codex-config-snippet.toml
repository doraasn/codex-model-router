# Merge these top-level keys into %USERPROFILE%\.codex\config.toml.
# Keep your existing MCP, plugin, trust, sandbox, and project settings.
model = "gpt-6-sol"
model_reasoning_effort = "medium"
model_provider = "local_router"
model_catalog_json = "<你的安装目录>/config/models.json"

[model_providers.local_router]
name = "GPT + DeepSeek + AstraHub"
base_url = "http://127.0.0.1:4010/v1"
wire_api = "responses"
requires_openai_auth = true
supports_websockets = false
